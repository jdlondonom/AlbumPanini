# Optional LAN-only HTTPS access for mobile scanner testing.
# Start with scripts/setup-mobile-https.ps1; the regular compose.yaml stays local.
services:
  mobile-https:
    image: caddy:2.11.4-alpine
    environment:
      PANINI_MOBILE_IP: ${PANINI_MOBILE_IP:?Run scripts/setup-mobile-https.ps1 first}
    ports:
      - target: 443
        published: "${PANINI_MOBILE_PROXY_PORT:-7443}"
        host_ip: "127.0.0.1"
        protocol: tcp
    volumes:
      - ./docker:/etc/caddy:ro
      - panini_mobile_tls:/data
      - panini_mobile_caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - 'test -s /data/caddy/pki/authorities/local/root.crt && wget -q --spider http://app:3010/health'
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  panini_mobile_tls:
  panini_mobile_caddy_config:
